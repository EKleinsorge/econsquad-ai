name: Monday AI for ED Drop — Weekly Send

on:
  schedule:
    # Runs every hour on Mondays from 13:00–20:00 UTC
    # = 9am–4pm ET / 8am–3pm CT / 7am–2pm MT / 6am–1pm PT
    # Edge function sends only to subscribers where it is currently 10am
    # in their stored timezone; unique constraint prevents double-sends.
    - cron: '0 13-20 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run — check only, do not send'
        required: false
        default: 'false'
      force:
        description: 'Force send to all subscribers regardless of their local time'
        required: false
        default: 'false'
      date_override:
        description: 'Send a specific issue by date (YYYY-MM-DD). Leave blank for today.'
        required: false
        default: ''

jobs:
  send-monday-drop:
    name: Send Monday Drop
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger send-monday-drop Edge Function
        run: |
          echo "Triggering Monday Drop send at $(date -u)"
          PAYLOAD="{\"dry_run\": \"$DRY_RUN\", \"force\": \"$FORCE\""
          if [ -n "$DATE_OVERRIDE" ]; then
            PAYLOAD="$PAYLOAD, \"date_override\": \"$DATE_OVERRIDE\""
          fi
          PAYLOAD="$PAYLOAD}"
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/functions/v1/send-monday-drop" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
          BODY=$(echo "$RESPONSE" | head -n -1)
          HTTP=$(echo "$RESPONSE" | tail -n1)
          echo "HTTP $HTTP"
          echo "$BODY"
          if [ "$HTTP" != "200" ]; then exit 1; fi
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || github.event.inputs.dry_run || 'false' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override || '' }}
